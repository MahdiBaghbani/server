name: OCM integration tests

on:
  push:
    branches: 
      - master
  pull_request:
    branches: 
      - master

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.get-version.outputs.version }}
      base_version: ${{ steps.get-base.outputs.version }}
      stable_versions: ${{ steps.get-stable-versions.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Get current version
        id: get-version
        run: |
          # Get only first 3 numbers from OC_Version array
          version=$(php -r 'include "version.php"; echo implode(".", array_slice($OC_Version, 0, 3));')
          echo "version=${version}" >> $GITHUB_OUTPUT
      
      - name: Determine base version
        id: get-base
        run: |
          current_major=$(echo "${{ steps.get-version.outputs.version }}" | cut -d. -f1)
          # List of available versions, newest first
          versions=("30.0.2" "29.0.10" "28.0.14" "27.1.11")
          
          # Find matching major version or use latest
          base_version="30.0.2"  # Default to latest
          for ver in "${versions[@]}"; do
            major=$(echo "$ver" | cut -d. -f1)
            if [ "$major" = "$current_major" ]; then
              base_version="$ver"
              break
            fi
          done
          
          # Add v prefix for Docker image tag
          echo "version=v${base_version}" >> $GITHUB_OUTPUT
      
      - name: Get stable versions
        id: get-stable-versions
        run: |
          # List of available versions to test against
          versions='["v30.0.2", "v29.0.10", "v28.0.14", "v27.1.11"]'
          echo "versions=${versions}" >> $GITHUB_OUTPUT

  ocm-tests:
    needs: determine-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        test_case: [share-with, share-link, invite-link]
        combination:
          # Current code as sender
          - sender_platform: nextcloud
            sender_version: current
            receiver_platform: nextcloud
            receiver_version: current
          - sender_platform: nextcloud
            sender_version: current
            receiver_platform: nextcloud
            receiver_version: v30.0.2
          - sender_platform: nextcloud
            sender_version: current
            receiver_platform: nextcloud
            receiver_version: v29.0.10
          - sender_platform: nextcloud
            sender_version: current
            receiver_platform: nextcloud
            receiver_version: v28.0.14
          - sender_platform: nextcloud
            sender_version: current
            receiver_platform: nextcloud
            receiver_version: v27.1.11
          # Current code as receiver
          - sender_platform: nextcloud
            sender_version: v30.0.2
            receiver_platform: nextcloud
            receiver_version: current
          - sender_platform: nextcloud
            sender_version: v29.0.10
            receiver_platform: nextcloud
            receiver_version: current
          - sender_platform: nextcloud
            sender_version: v28.0.14
            receiver_platform: nextcloud
            receiver_version: current
          - sender_platform: nextcloud
            sender_version: v27.1.11
            receiver_platform: nextcloud
            receiver_version: current

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        run: |
          # Get Docker GID
          DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          echo "DOCKER_GID=${DOCKER_GID}" >> $GITHUB_ENV

      - name: Pull dependencies
        run: |
          docker pull mariadb:11.4.2
          docker pull cypress/included:13.13.1
          docker pull pondersource/nextcloud-ci:latest

      - name: Run tests
        run: |
          # For sender
          if [ "${{ matrix.combination.sender_version }}" = "current" ]; then
            # Use current code from the workspace
            export SENDER_REPO_URL="https://github.com/${{ github.repository }}"
            export SENDER_BRANCH="${{ github.ref_name }}"
            export SENDER_COMMIT="${{ github.sha }}"
            export SENDER_IMAGE="pondersource/nextcloud-ci:latest"
            export SENDER_ENV="-e NEXTCLOUD_REPO_URL=${SENDER_REPO_URL} -e NEXTCLOUD_BRANCH=${SENDER_BRANCH} -e NEXTCLOUD_COMMIT_HASH=${SENDER_COMMIT}"
          else
            # Use specific version from GitHub
            export SENDER_REPO_URL="https://github.com/nextcloud/server"
            export SENDER_BRANCH="${{ matrix.combination.sender_version }}"
            # For stable versions, use the tag as the commit
            export SENDER_COMMIT="${{ matrix.combination.sender_version }}"
            export SENDER_IMAGE="pondersource/nextcloud-ci:latest"
            export SENDER_ENV="-e NEXTCLOUD_REPO_URL=${SENDER_REPO_URL} -e NEXTCLOUD_BRANCH=${SENDER_BRANCH} -e NEXTCLOUD_COMMIT_HASH=${SENDER_COMMIT}"
          fi
          
          # For receiver
          if [ "${{ matrix.combination.receiver_version }}" = "current" ]; then
            # Use current code from the workspace
            export RECEIVER_REPO_URL="https://github.com/${{ github.repository }}"
            export RECEIVER_BRANCH="${{ github.ref_name }}"
            export RECEIVER_COMMIT="${{ github.sha }}"
            export RECEIVER_IMAGE="pondersource/nextcloud-ci:latest"
            export RECEIVER_ENV="-e NEXTCLOUD_REPO_URL=${RECEIVER_REPO_URL} -e NEXTCLOUD_BRANCH=${RECEIVER_BRANCH} -e NEXTCLOUD_COMMIT_HASH=${RECEIVER_COMMIT}"
          else
            # Use specific version from GitHub
            export RECEIVER_REPO_URL="https://github.com/nextcloud/server"
            export RECEIVER_BRANCH="${{ matrix.combination.receiver_version }}"
            # For stable versions, use the tag as the commit
            export RECEIVER_COMMIT="${{ matrix.combination.receiver_version }}"
            export RECEIVER_IMAGE="pondersource/nextcloud-ci:latest"
            export RECEIVER_ENV="-e NEXTCLOUD_REPO_URL=${RECEIVER_REPO_URL} -e NEXTCLOUD_BRANCH=${RECEIVER_BRANCH} -e NEXTCLOUD_COMMIT_HASH=${RECEIVER_COMMIT}"
          fi
          
          echo "Using sender image: ${SENDER_IMAGE} with ${SENDER_ENV}"
          echo "Using receiver image: ${RECEIVER_IMAGE} with ${RECEIVER_ENV}"
          
          # Run test suite with Docker socket mounted
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --group-add ${DOCKER_GID} \
            -e SENDER_IMAGE="${SENDER_IMAGE}" \
            -e SENDER_ENV="${SENDER_ENV}" \
            -e RECEIVER_IMAGE="${RECEIVER_IMAGE}" \
            -e RECEIVER_ENV="${RECEIVER_ENV}" \
            -e USE_CI_IMAGE="true" \
            ghcr.io/pondersource/nextcloud-ocm-test:latest \
            ${{ matrix.test_case }} \
            ${{ matrix.combination.sender_platform }} \
            ${{ matrix.combination.sender_version }} \
            ci \
            electron \
            ${{ matrix.combination.receiver_platform }} \
            ${{ matrix.combination.receiver_version }}

      - name: Upload Cypress video artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.test_case }} from ${{ matrix.combination.sender_platform }} ${{ matrix.combination.sender_version }} to ${{ matrix.combination.receiver_platform }} ${{ matrix.combination.receiver_version }}
          path: ./cypress/ocm-test-suite/cypress/videos
