name: OCM debugging

on:
  push:
    branches: 
      - master
  pull_request:
    branches: 
      - master

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      stable_versions : ${{ steps.get-stable-versions.outputs.versions }}
      matrix          : ${{ steps.build-matrix.outputs.matrix }}
    steps:
      # Grab the latest patch tag for every major ≥ 27
      - name: Get stable versions (majors ≥ 27)
        id: get-stable-versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tags=$(gh api 'repos/nextcloud/server/tags?per_page=100' --paginate \
                  --jq '.[].name' |
                 grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' |
                 sed 's/^v//' |
                 sort -Vr)

          majors_seen=()
          versions=()

          while read -r tag; do
            major="${tag%%.*}"
            if (( major >= 27 )) && [[ ! " ${majors_seen[*]} " =~ " ${major} " ]]; then
              versions+=( "v${tag}" )
              majors_seen+=( "${major}" )
            fi
          done <<< "$tags"

          json=$(printf '%s\n' "${versions[@]}" | jq -Rsc 'split("\n")[:-1]')
          echo "versions=${json}" >> "$GITHUB_OUTPUT"

          echo "📝  Stable versions detected:"
          echo "$json" | jq .

      # Expand that list into the sender/receiver matrix
      - name: Build sender/receiver matrix
        id: build-matrix
        env:
          STABLE_VERSIONS: ${{ steps.get-stable-versions.outputs.versions }}
        shell: bash
        run: |
          readarray -t arr < <(jq -r '.[]' <<<"$STABLE_VERSIONS")
          combos=()
          for v in "${arr[@]}"; do
            combos+=("{\"sender_platform\":\"nextcloud\",\"sender_version\":\"current\",\"receiver_platform\":\"nextcloud\",\"receiver_version\":\"${v}\"}")
            combos+=("{\"sender_platform\":\"nextcloud\",\"sender_version\":\"${v}\",\"receiver_platform\":\"nextcloud\",\"receiver_version\":\"current\"}")
          done
          matrix_json="[$(IFS=','; echo "${combos[*]}")]"
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

          echo "📝  Combination matrix (truncated to first 1 kB):"
          echo "$matrix_json" | jq . | head -c 1024
          [ $(echo "$matrix_json" | wc -c) -gt 1024 ] && echo -e "\n…(truncated)…"
