name: OCM debugging

on:
  push:
    branches: 
      - master
  pull_request:
    branches: 
      - master

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      stable_versions : ${{ steps.get-stable-versions.outputs.versions }}
      matrix          : ${{ steps.build-matrix.outputs.matrix }}
      current_version : ${{ steps.current-ver.outputs.version }}

    steps:
      # access version.php
      - uses: actions/checkout@v4
      - name: Install GitHub CLI + jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gh jq

      - name: Derive current Nextcloud version
        id: current-ver
        shell: bash
        run: |
          # Extract first three numbers from the OC_Version array in version.php
          ver=$(grep -Eo '\$OC_Version\s*=\s*\[[^]]+' version.php |
                grep -Eo '[0-9]+' | head -n 3 | paste -sd'.' -)

          if [[ ! $ver =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not parse version.php (got \"$ver\")"
            exit 1
          fi

          echo "version=v${ver}" >> "$GITHUB_OUTPUT"
          echo "Detected Nextcloud version: v${ver}"

      - name: Get stable versions (majors ≥ 27)
        id: get-stable-versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tags=$(gh api 'repos/nextcloud/server/tags?per_page=100' --paginate \
                  --jq '.[].name' |
                 grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' |
                 sed 's/^v//' |
                 sort -Vr)

          majors_seen=()
          versions=()

          while read -r tag; do
            major="${tag%%.*}"
            if (( major >= 27 )) && [[ ! " ${majors_seen[*]} " =~ " ${major} " ]]; then
              versions+=( "v${tag}" )
              majors_seen+=( "${major}" )
            fi
          done <<< "$tags"

          json=$(printf '%s\n' "${versions[@]}" | jq -Rsc 'split("\n")[:-1]')
          echo "versions=${json}" >> "$GITHUB_OUTPUT"

          echo "Stable versions detected:"
          echo "$json" | jq .

      - name: Build sender/receiver matrix
        id: build-matrix
        env:
          STABLE_VERSIONS: ${{ steps.get-stable-versions.outputs.versions }}
        shell: bash
        run: |
          readarray -t arr < <(jq -r '.[]' <<<"$STABLE_VERSIONS")
          combos=()

          # current - current  (self test)
          combos+=('{"sender_platform":"nextcloud","sender_version":"current","receiver_platform":"nextcloud","receiver_version":"current"}')

          # current - stable  (upgrade / downgrade)
          for v in "${arr[@]}"; do
            combos+=("{\"sender_platform\":\"nextcloud\",\"sender_version\":\"current\",\"receiver_platform\":\"nextcloud\",\"receiver_version\":\"${v}\"}")
            combos+=("{\"sender_platform\":\"nextcloud\",\"sender_version\":\"${v}\",\"receiver_platform\":\"nextcloud\",\"receiver_version\":\"current\"}")
          done
          matrix_json="[$(IFS=','; echo "${combos[*]}")]"
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

          echo "Combination matrix (truncated to first 1  kB):"
          echo "$matrix_json" | jq . | head -c 1024
          [ $(echo "$matrix_json" | wc -c) -gt 1024 ] && echo -e "\n…(truncated)…"

  ocm-tests:
    needs: 
      - "build-matrix"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_case : [ share-with ]
        combination: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    env:
      CURRENT_VERSION: ${{ needs.build-matrix.outputs.current_version }}

    steps:
      - name: Pull images
        run: |
          docker pull mariadb:11.4.4
          docker pull pondersource/cypress:latest
          docker pull pondersource/dev-stock:latest
          docker pull pondersource/nextcloud-ci:latest

      - name: Run ${{ matrix.test_case }}
        env:
          SENDER_PLATFORM:   ${{ matrix.combination.sender_platform }}
          SENDER_VERSION:    ${{ matrix.combination.sender_version }}
          RECEIVER_PLATFORM: ${{ matrix.combination.receiver_platform }}
          RECEIVER_VERSION:  ${{ matrix.combination.receiver_version }}
        shell: bash
        run: |
          make_env() {
            if [ "$1" = "current" ]; then
              printf -- '-e NEXTCLOUD_REPO_URL=%s -e NEXTCLOUD_COMMIT_HASH=%s' \
                      "https://github.com/${{ github.repository }}" "${{ github.sha }}"
            else
              printf -- '-e NEXTCLOUD_REPO_URL=https://github.com/nextcloud/server -e NEXTCLOUD_TAG=%s' "$1"
            fi
          }

          SENDER_ENV=$(make_env "$SENDER_VERSION")
          RECEIVER_ENV=$(make_env "$RECEIVER_VERSION")

          # translate placeholder 'current' to real vX.Y.Z
          [[ $SENDER_VERSION   == "current" ]] && SENDER_VER_ARG="$CURRENT_VERSION"   || SENDER_VER_ARG="$SENDER_VERSION"
          [[ $RECEIVER_VERSION == "current" ]] && RECEIVER_VER_ARG="$CURRENT_VERSION" || RECEIVER_VER_ARG="$RECEIVER_VERSION"

          docker run --rm \
            --name="dev-stock-${GITHUB_RUN_ID}-${GITHUB_JOB}" \
            -e CI_ENVIRONMENT=true \
            -e DEVSTOCK_DEBUG=true \
            -e SENDER_ENV="$SENDER_ENV" \
            -e RECEIVER_ENV="$RECEIVER_ENV" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            pondersource/dev-stock:latest \
            ${{ matrix.test_case }} \
            "$SENDER_PLATFORM"  "$SENDER_VER_ARG" \
            ci electron \
            "$RECEIVER_PLATFORM" "$RECEIVER_VER_ARG"
