name: OCM debugging

on:
  push:
    branches: 
      - master
  pull_request:
    branches: 
      - master

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      stable_versions : ${{ steps.get-stable-versions.outputs.versions }}
      matrix          : ${{ steps.build-matrix.outputs.matrix }}
    steps:
      # Grab the latest patch tag for every major ≥ 27
      - name: Get stable versions (majors ≥ 27)
        id: get-stable-versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tags=$(gh api 'repos/nextcloud/server/tags?per_page=100' --paginate \
                  --jq '.[].name' |
                 grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' |
                 sed 's/^v//' |
                 sort -Vr)

          majors_seen=()
          versions=()

          while read -r tag; do
            major="${tag%%.*}"
            if (( major >= 27 )) && [[ ! " ${majors_seen[*]} " =~ " ${major} " ]]; then
              versions+=( "v${tag}" )
              majors_seen+=( "${major}" )
            fi
          done <<< "$tags"

          json=$(printf '%s\n' "${versions[@]}" | jq -Rsc 'split("\n")[:-1]')
          echo "versions=${json}" >> "$GITHUB_OUTPUT"

          echo "Stable versions detected:"
          echo "$json" | jq .

      # Expand that list into the sender/receiver matrix
      - name: Build sender/receiver matrix
        id: build-matrix
        env:
          STABLE_VERSIONS: ${{ steps.get-stable-versions.outputs.versions }}
        shell: bash
        run: |
          readarray -t arr < <(jq -r '.[]' <<<"$STABLE_VERSIONS")
          combos=()

          # current - current  (self test)
          combos+=('{"sender_platform":"nextcloud","sender_version":"current","receiver_platform":"nextcloud","receiver_version":"current"}')

          # current - stable  (upgrade / downgrade)
          for v in "${arr[@]}"; do
            combos+=("{\"sender_platform\":\"nextcloud\",\"sender_version\":\"current\",\"receiver_platform\":\"nextcloud\",\"receiver_version\":\"${v}\"}")
            combos+=("{\"sender_platform\":\"nextcloud\",\"sender_version\":\"${v}\",\"receiver_platform\":\"nextcloud\",\"receiver_version\":\"current\"}")
          done
          matrix_json="[$(IFS=','; echo "${combos[*]}")]"
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

          echo "Combination matrix (truncated to first 1  kB):"
          echo "$matrix_json" | jq . | head -c 1024
          [ $(echo "$matrix_json" | wc -c) -gt 1024 ] && echo -e "\n…(truncated)…"

  ocm-tests:
    needs: build-matrix
    runs-on: ubuntu-latest-xl
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_case : [ share-with ]
        combination: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Detect Docker GID
      run: echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"

    - name: Pull images
      run: |
        docker pull mariadb:11.4.2
        docker pull cypress/included:13.13.1
        docker pull pondersource/dev-stock:latest
        docker pull pondersource/nextcloud-ci:latest

    - name: Run ${{ matrix.test_case }}
      env:
        SENDER_PLATFORM:   ${{ matrix.combination.sender_platform }}
        SENDER_VERSION:    ${{ matrix.combination.sender_version }}
        RECEIVER_PLATFORM: ${{ matrix.combination.receiver_platform }}
        RECEIVER_VERSION:  ${{ matrix.combination.receiver_version }}
      shell: bash
      run: |
        make_env () {
          if [ "$2" = "current" ]; then
            echo "-e NEXTCLOUD_REPO_URL=https://github.com/${{ github.repository }} -e NEXTCLOUD_COMMIT_HASH=${{ github.sha }}"
          else
            echo "-e NEXTCLOUD_REPO_URL=https://github.com/nextcloud/server -e NEXTCLOUD_TAG=$2"
          fi
        }

        SENDER_ENV=$(make_env SENDER  "$SENDER_VERSION")
        RECEIVER_ENV=$(make_env RECEIVER "$RECEIVER_VERSION")

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          --group-add "$DOCKER_GID" \
          -e USE_CI_IMAGE=true \
          -e SENDER_ENV="$SENDER_ENV" \
          -e RECEIVER_ENV="$RECEIVER_ENV" \
          pondersource/dev-stock:latest \
          ${{ matrix.test_case }} \
          "$SENDER_PLATFORM"  "$SENDER_VERSION" \
          dev electron \
          "$RECEIVER_PLATFORM" "$RECEIVER_VERSION"
    
    - name: Dump OOM report
      if: failure()
      run: dmesg | grep -i -E 'killed process|out of memory' || true
